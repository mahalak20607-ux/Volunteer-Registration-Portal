<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | VolunteerHub</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- ================================
     NAVIGATION
================================ -->

<header class="navbar">

    <a href="index.html" class="brand">

        <span>V</span>

        VolunteerHub

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="events.html">
            Opportunities
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="register.html"
           class="nav-btn">

            Join Now

        </a>

    </nav>


    <button class="menu-btn"
            aria-label="Open menu">

        ☰

    </button>

</header>



<!-- ================================
     LOGIN PAGE
================================ -->

<main class="login-page">


    <section class="login-card">


        <!-- Logo -->

        <div class="logo-circle">
            V
        </div>


        <!-- Heading -->

        <div class="eyebrow">
            WELCOME BACK
        </div>


        <h1>
            Volunteer login
        </h1>


        <p class="muted">
            Access your volunteer dashboard.
        </p>



        <!-- Login Form -->

        <form id="loginForm">


            <!-- Email -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Remember -->

            <label class="remember">

                <input
                    type="checkbox"
                    id="rememberMe">

                <span>
                    Remember me
                </span>

            </label>


            <!-- Login button -->

            <button
                type="submit"
                class="btn primary full-btn">

                Login →

            </button>


            <!-- Message -->

            <p
                id="loginMessage"
                class="form-message">
            </p>


        </form>


        <!-- Register link -->

        <p class="login-note">

            Don't have an account?

            <a href="register.html">
                Register now
            </a>

        </p>


    </section>

</main>



<!-- ================================
     FOOTER
================================ -->

<footer>

    <div>

        <strong>
            VolunteerHub
        </strong>

        <p>
            Connecting people with purpose.
        </p>

    </div>


    <div>

        <p>
            © 2026 VolunteerHub.
            All rights reserved.
        </p>

    </div>

</footer>



<!-- JAVASCRIPT -->

<script src="js/login.js"></script>

<script src="js/script.js"></script>


</body>

</html>
